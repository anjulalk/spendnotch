version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor]
      patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
